  <rect class="red" x="880" y="1040" width="696" height="170" rx="10"/>
  <text class="h2" x="902" y="1072">归因边界</text>
  <text class="body" x="902" y="1110">“行动后指标改善”不等于“行动造成全部改善”。</text>
  <text class="body" x="902" y="1138">本周期存在多个并行工单，系统不计算单工单收入贡献。</text>
  <text class="body" x="902" y="1166">AI 只能解释相关性、干扰因素和后续验证方法。</text>


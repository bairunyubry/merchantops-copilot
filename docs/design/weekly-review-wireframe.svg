  <rect class="card" x="1080" y="1230" width="496" height="202" rx="10"/>
  <text class="h2" x="1102" y="1263">下周优先事项</text><rect class="aiTag" x="1432" y="1247" width="112" height="22" rx="11"/><text x="1451" y="1262" font-family="Microsoft YaHei" font-size="9" font-weight="700" fill="#674dbd">AI 排序解释</text>
  <circle cx="1118" cy="1300" r="13" fill="#e5ecfb"/><text x="1114" y="1305" font-family="sans-serif" font-size="10" fill="#365dcb">1</text><text class="body" x="1142" y="1305">继续处理履约，目标恢复至 90%</text>
  <circle cx="1118" cy="1341" r="13" fill="#e5ecfb"/><text x="1114" y="1346" font-family="sans-serif" font-size="10" fill="#365dcb">2</text><text class="body" x="1142" y="1346">为库存供给异常创建补货工单</text>
  <circle cx="1118" cy="1382" r="13" fill="#e5ecfb"/><text x="1114" y="1387" font-family="sans-serif" font-size="10" fill="#365dcb">3</text><text class="body" x="1142" y="1387">确认退款工单关闭并保存经验</text>

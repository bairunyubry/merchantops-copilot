  <text class="body" x="222" y="1110">净收入：¥109,855 → ¥117,200</text><text class="body" x="222" y="1138">退款金额：¥12,944 → ¥5,100</text><text class="body" x="222" y="1166">转化率：6.66% → 6.91%</text>

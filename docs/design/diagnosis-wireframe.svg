<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1550" viewBox="0 0 1440 1550">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #202735; }
      .h1 { font-size: 23px; font-weight: 700; }
      .h2 { font-size: 16px; font-weight: 700; }
      .h3 { font-size: 14px; font-weight: 700; }
      .body { font-size: 12px; }
      .small { font-size: 10px; fill: #737d90; }
      .tiny { font-size: 9px; fill: #8992a3; }
      .box { fill: #fff; stroke: #b9c1cf; stroke-width: 1.5; rx: 8; }
      .soft { fill: #f6f7f9; stroke: #d7dce5; stroke-width: 1.5; rx: 8; }
      .active { fill: #eef3ff; stroke: #809bea; stroke-width: 1.5; rx: 8; }
      .risk { fill: #fff7f7; stroke: #d98787; stroke-width: 1.5; rx: 8; }
      .ai { fill: #faf8ff; stroke: #a79add; stroke-width: 1.5; rx: 8; }
      .line { stroke: #99a3b4; stroke-width: 1.5; fill: none; }
      .dash { stroke: #a6afbe; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
      .note { font-size: 10px; fill: #4f70d8; }
    </style>
  </defs>
  <rect width="1440" height="1550" fill="#eef1f5"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="176" height="1550" fill="#1f2735"/>

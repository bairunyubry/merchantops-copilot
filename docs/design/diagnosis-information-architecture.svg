<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #657087; }
      .section { font-size: 19px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; fill: #657087; }
      .card { fill: #ffffff; stroke: #b9c2d3; stroke-width: 2; rx: 12; }
      .primary { fill: #eef4ff; stroke: #4f7cff; stroke-width: 2; rx: 12; }
      .risk { fill: #fff2f2; stroke: #db5b5b; stroke-width: 2; rx: 12; }
      .ai { fill: #f4f0ff; stroke: #8069db; stroke-width: 2; rx: 12; }
      .muted { fill: #f7f8fa; stroke: #d5dae4; stroke-width: 2; rx: 12; }
      .arrow { stroke: #8c96aa; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flow { stroke: #4f7cff; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8c96aa"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f7cff"/></marker>
  </defs>
  <rect width="1600" height="1080" fill="#f5f7fb"/>
  <text x="64" y="62" class="title">异常诊断页｜信息架构 v0.1</text>
  <text x="64" y="91" class="subtitle">页面任务：展示全部独立异常，解释排序依据，并让用户从规则证据进入 AI 解读或行动工单</text>

  <text x="64" y="139" class="section">入口与状态继承</text>
  <rect x="64" y="162" width="300" height="96" class="primary"/>
  <text x="88" y="197" class="label">经营总览“查看完整诊断”</text>
  <text x="88" y="225" class="small">进入 /diagnosis?finding=当前最高优先级</text>
  <rect x="418" y="162" width="300" height="96" class="card"/>
  <text x="442" y="197" class="label">左侧导航“异常诊断”</text>
  <text x="442" y="225" class="small">进入 /diagnosis，默认选中第一名</text>
  <rect x="772" y="162" width="764" height="96" class="muted"/>
  <text x="796" y="197" class="label">继承同一份经营数据状态</text>
  <text x="796" y="225" class="small">店铺｜数据来源｜截止日期｜聚合快照｜Findings；不重新上传、不重复计算另一套口径</text>
  <path d="M364 210 H418" class="arrow"/>
  <path d="M718 210 H772" class="arrow"/>

  <text x="64" y="307" class="section">页面模块层级</text>
  <rect x="64" y="330" width="280" height="382" class="muted"/>
  <text x="88" y="366" class="section">异常浏览区</text>
  <text x="88" y="405" class="label">本期异常概览</text>
  <text x="88" y="432" class="small">异常数量｜最高优先级｜数据周期</text>
  <text x="88" y="475" class="label">全部独立异常列表</text>
  <text x="88" y="502" class="small">排名｜标题｜严重度｜优先级分数</text>
  <text x="88" y="528" class="small">当前值｜变化幅度｜关联 SKU</text>
  <line x1="88" y1="554" x2="320" y2="554" stroke="#d5dae4"/>
  <text x="88" y="586" class="label">规则合并原则</text>
  <text x="88" y="613" class="small">规则命中 ≠ 用户可见异常</text>
  <text x="88" y="639" class="small">退款上升 + SKU 集中贡献</text>
  <text x="88" y="665" class="small">合并为一条“退款异常”Finding</text>

  <rect x="380" y="330" width="750" height="382" class="card"/>
  <text x="404" y="366" class="section">规则诊断详情（页面主体）</text>
  <rect x="404" y="389" width="702" height="72" class="risk"/>
  <text x="426" y="420" class="label">① 异常结论与综合优先级</text>
  <text x="426" y="444" class="small">标题｜排名｜严重度｜综合分数｜置信度｜关联 SKU</text>
  <rect x="404" y="477" width="335" height="84" class="primary"/>
  <text x="426" y="508" class="label">② 为什么它排第一</text>
  <text x="426" y="533" class="small">严重度 45%｜影响 35%｜置信度 20%</text>
  <rect x="771" y="477" width="335" height="84" class="card"/>
  <text x="793" y="508" class="label">③ 指标与规则口径</text>
  <text x="793" y="533" class="small">当前值｜基线值｜阈值｜样本量</text>
  <rect x="404" y="577" width="335" height="108" class="card"/>
  <text x="426" y="608" class="label">④ 趋势与 SKU 贡献</text>
  <text x="426" y="633" class="small">异常起点｜30 日趋势｜贡献排行</text>
  <text x="426" y="658" class="small">影响订单 / GMV / 净收入</text>
  <rect x="771" y="577" width="335" height="108" class="card"/>
  <text x="793" y="608" class="label">⑤ 证据与待验证原因</text>
  <text x="793" y="633" class="small">事实证据｜原因假设｜归因边界</text>
  <text x="793" y="658" class="small">规则建议｜验证方法</text>

  <rect x="1166" y="330" width="370" height="382" class="ai"/>
  <text x="1190" y="366" class="section">AI 解读层（默认收起）</text>
  <text x="1190" y="406" class="label">触发方式</text>
  <text x="1190" y="433" class="small">诊断详情点击“让 AI 解释”</text>
  <text x="1190" y="458" class="small">携带当前 selectedFindingId</text>
  <text x="1190" y="502" class="label">回答范围</text>
  <text x="1190" y="529" class="small">解释异常｜可能原因｜检查步骤</text>
  <text x="1190" y="554" class="small">行动建议｜7 天后验证方法</text>
  <text x="1190" y="598" class="label">能力边界</text>
  <text x="1190" y="625" class="small">不改规则结论、不重排优先级</text>
  <text x="1190" y="650" class="small">不得把待验证原因写成确定因果</text>
  <text x="1190" y="680" class="small">关闭诊断页后仍保留所选异常上下文</text>
  <path d="M344 521 H380" class="arrow"/>
  <path d="M1130 521 H1166" class="arrow"/>

  <text x="64" y="766" class="section">核心交互路径</text>
  <rect x="64" y="792" width="234" height="92" class="card"/>
  <text x="88" y="828" class="label">1. 进入诊断页</text>
  <text x="88" y="855" class="small">继承数据并选中最高优先级异常</text>
  <rect x="344" y="792" width="234" height="92" class="primary"/>
  <text x="368" y="828" class="label">2. 浏览全部异常</text>
  <text x="368" y="855" class="small">按综合优先级排序与切换</text>
  <rect x="624" y="792" width="234" height="92" class="risk"/>
  <text x="648" y="828" class="label">3. 理解排名与证据</text>
  <text x="648" y="855" class="small">当前 / 基线 / 阈值 / 影响</text>
  <rect x="904" y="792" width="234" height="92" class="ai"/>
  <text x="928" y="828" class="label">4. 让 AI 解释</text>
  <text x="928" y="855" class="small">携带当前异常打开侧栏</text>
  <rect x="1184" y="792" width="352" height="92" class="card"/>
  <text x="1208" y="828" class="label">5. 采纳建议 / 自定义行动</text>
  <text x="1208" y="855" class="small">进入行动工单并保存异常基线</text>
  <path d="M298 838 H344" class="flow"/>
  <path d="M578 838 H624" class="flow"/>
  <path d="M858 838 H904" class="flow"/>
  <path d="M1138 838 H1184" class="flow"/>

  <rect x="64" y="930" width="1472" height="100" class="muted"/>
  <text x="88" y="966" class="section">排序与表达规则</text>
  <text x="88" y="997" class="small">诊断优先级 = 严重度 × 45% + 经营影响 × 35% + 数据置信度 × 20%；排序由规则层完成，AI 只解释</text>
  <text x="920" y="997" class="small">红色只表示风险｜相关性不写成因果｜空数据或无异常时提供明确空状态</text>
</svg>
